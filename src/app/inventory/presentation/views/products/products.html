<div class="products-header">

  <div>
    <h1>Products</h1>
    <p>Manage the products registered in your inventory.</p>
  </div>

  <button
    mat-flat-button
    type="button"
    (click)="onCreate()"
  >
    <mat-icon>add</mat-icon>
    New product
  </button>

</div>

<app-product-list
  [products]="products()"
  [categories]="categories()"
  (edit)="onEdit($event)"
  (remove)="onDelete($event)"
/>
