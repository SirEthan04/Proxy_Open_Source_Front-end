<h2 mat-dialog-title>
  @if (data.product) {
    Edit product
  } @else {
    New product
  }
</h2>

<mat-dialog-content>

  <app-product-form
    [categories]="data.categories"
    [product]="data.product"
    (productSaved)="onProductSaved($event)"
  />

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="onCancel()"
  >
    Cancel
  </button>

</mat-dialog-actions>
