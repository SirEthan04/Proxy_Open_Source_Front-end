<div>
  <h2>{{ product().name }}</h2>

  <p>{{ product().description }}</p>

  <p>{{ 'common.price' | translate }}: S/ {{ product().price }}</p>

  <p>{{ 'common.minimumStock' | translate }}: {{ product().minimumStock }}</p>

  <button
    type="button"
    (click)="onEdit()"
  >
    {{ 'common.edit' | translate }}
  </button>

  <button
    type="button"
    (click)="onDelete()"
  >
    {{ 'common.delete' | translate }}
  </button>
  <hr>

</div>
