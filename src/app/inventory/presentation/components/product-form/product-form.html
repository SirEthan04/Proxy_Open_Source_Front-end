<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
>

  <div>
    <label for="name">Name</label>

    <input
      id="name"
      type="text"
      formControlName="name"
    >
  </div>

  <div>
    <label for="description">Description</label>

    <input
      id="description"
      type="text"
      formControlName="description"
    >
  </div>

  <div>
    <label for="category">Category</label>

    <select
      id="category"
      formControlName="categoryId"
    >

      <option value="0">
        Select category
      </option>

      @for (category of categories(); track category.id) {

        <option [value]="category.id">
          {{ category.name }}
        </option>

      }

    </select>
  </div>

  <div>
    <label for="price">Price</label>

    <input
      id="price"
      type="number"
      step="0.01"
      formControlName="price"
    >
  </div>

  <div>
    <label for="minimumStock">Minimum stock</label>

    <input
      id="minimumStock"
      type="number"
      formControlName="minimumStock"
    >
  </div>

  <div>
    <label>
      <input
        type="checkbox"
        formControlName="active"
      >
      Active
    </label>
  </div>

  <button
    type="submit"
    [disabled]="form.invalid"
  >
    Create product
  </button>

  <button
    type="submit"
    [disabled]="form.invalid"
  >
    @if (product()) {
      Update product
    } @else {
      Create product
    }
  </button>

</form>
